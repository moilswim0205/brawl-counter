<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>드래프트 도우미 · Brawl Counter</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site"></header>
  <main>
    <h1>드래프트 도우미</h1>
    <p class="muted">맵과 상대팀 픽, 우리팀 픽을 입력하면 점수 기반으로 카운터 픽을 추천합니다.</p>

    <div class="panel">
      <label for="mode">모드</label>
      <select id="mode"></select>
      <label for="map" style="margin-left:16px">맵</label>
      <select id="map" disabled></select>
    </div>

    <div class="draft-grid">
      <div class="panel">
        <h2 style="margin-top:0">상대팀</h2>
        <div class="pick-slot"><span class="num">1</span><select id="enemy-0" class="enemy-pick"></select></div>
        <div class="pick-slot"><span class="num">2</span><select id="enemy-1" class="enemy-pick"></select></div>
        <div class="pick-slot"><span class="num">3</span><select id="enemy-2" class="enemy-pick"></select></div>
      </div>
      <div class="panel">
        <h2 style="margin-top:0">우리팀 (이미 픽한 것)</h2>
        <div class="pick-slot"><span class="num">1</span><select id="ally-0" class="ally-pick"></select></div>
        <div class="pick-slot"><span class="num">2</span><select id="ally-1" class="ally-pick"></select></div>
      </div>
    </div>

    <h2>추천 픽 (점수 높은 순)</h2>
    <div class="panel" id="range-filter" style="margin-bottom:12px"></div>
    <ul id="recommend" class="recommend-list"></ul>
    <p id="empty" class="empty-hint">위 입력을 채울수록 추천이 정확해집니다.</p>
  </main>
  <script type="module" src="js/draft.js"></script>
</body>
</html>
