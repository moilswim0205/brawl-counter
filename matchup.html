<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>상성표 · Brawl Counter</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site"></header>
  <main>
    <h1>브롤러 상성표</h1>
    <p class="muted">기준 브롤러를 선택하면 다른 브롤러를 상대로의 유불리(-2 ~ +2)를 보여줍니다.</p>

    <div class="panel form-row">
      <div class="form-field">
        <label for="brawler">기준 브롤러</label>
        <select id="brawler"></select>
      </div>
    </div>

    <div class="panel" id="range-filter"></div>

    <h2 id="result-title" style="display:none">상성</h2>
    <div id="result" class="matchup-grid"></div>

    <h2 id="map-title" style="display:none">유리한 맵</h2>
    <div id="map-result" class="map-list"></div>

    <p id="empty" class="empty-hint">먼저 기준 브롤러를 선택하세요.</p>
  </main>
  <script type="module" src="js/matchup.js"></script>
</body>
</html>
